<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 3: Placement Portal Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,400&family=Poppins:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --color-paper: #ffffff; 
      --color-paper-2: #fef5f6; 
      --color-ink: #2f050b; 
      --color-muted: #95505b; 
      --color-soft: #b07a82; 
      --color-rule: rgba(47,5,11,0.12); 
      --color-accent: #bd112d; 
      --color-link: #3b82f6; 
      --font-sans: 'Poppins', 'Geist', system-ui, sans-serif; 
      --font-serif: 'Montserrat', serif; 
      --font-mono: 'Geist Mono', ui-monospace, monospace; 
    }
    body { font-family: var(--font-sans); background: var(--color-paper); min-height: 100vh; padding: 3rem 2rem; color: var(--color-ink); }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2.5rem; }
    .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 62ch; }
    .diagram-container { background: var(--color-paper-2); border-radius: 8px; border: 1px solid var(--color-rule); padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .cards { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 1rem; margin-top: 1.5rem; }
    @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
    .card { background: #ffffff; border-radius: 6px; border: 1px solid var(--color-rule); padding: 1.25rem; }
    .card .eyebrow { font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(47,5,11,0.08); }
    .card-dot { width: 7px; height: 7px; border-radius: 50%; }
    .card-dot.ink { background: var(--color-ink); } .card-dot.muted { background: var(--color-muted); } .card-dot.coral { background: var(--color-accent); }
    .card h3 { font-size: 0.875rem; font-weight: 600; font-family: var(--font-sans); }
    .card p, .card ul { color: var(--color-muted); font-size: 0.8125rem; line-height: 1.55; list-style: none; font-family: 'Geist', sans-serif; }
    .card li { margin-bottom: 0.3rem; padding-left: 0.875rem; position: relative; }
    .card li::before { content: '—'; position: absolute; left: 0; color: rgba(47,5,11,0.25); font-size: 0.75rem; }
    .footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(47,5,11,0.10); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--color-soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="diagram-container">
      <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(47,5,11,0.08)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#95505b"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd112d"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.8"/>

        <!-- Arrows (drawn first) -->
        <line x1="500" y1="88" x2="500" y2="120" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <line x1="500" y1="168" x2="500" y2="200" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Diamond 1 NO -->
        <line x1="600" y1="248" x2="720" y2="248" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 YES -->
        <line x1="500" y1="296" x2="500" y2="336" stroke="#bd112d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        
        <!-- Submit -> Review -->
        <line x1="500" y1="384" x2="500" y2="416" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Review -> Diamond 2 -->
        <line x1="500" y1="464" x2="500" y2="496" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Diamond 2 NO -->
        <line x1="600" y1="544" x2="720" y2="544" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 YES -->
        <line x1="500" y1="592" x2="500" y2="632" stroke="#bd112d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow Labels -->
        <rect x="644" y="238" width="24" height="12" rx="2" fill="#ffffff"/>
        <text x="656" y="247" fill="#95505b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        
        <rect x="484" y="306" width="32" height="12" rx="2" fill="#ffffff"/>
        <text x="500" y="315" fill="#bd112d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="644" y="534" width="24" height="12" rx="2" fill="#ffffff"/>
        <text x="656" y="543" fill="#95505b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        
        <rect x="484" y="602" width="32" height="12" rx="2" fill="#ffffff"/>
        <text x="500" y="611" fill="#bd112d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <!-- Start Oval -->
        <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(47,5,11,0.03)" stroke="rgba(47,5,11,0.30)" stroke-width="1"/>
        <text x="500" y="68" fill="#2f050b" font-size="12" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Job Posting Published</text>

        <!-- Step: Browse Postings -->
        <rect x="420" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#2f050b" stroke-width="1"/>
        <text x="500" y="148" fill="#2f050b" font-size="12" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Student Browses Board</text>

        <!-- Diamond 1: Meets Requirements? -->
        <polygon points="500,200 600,248 500,296 400,248" fill="#ffffff" stroke="#2f050b" stroke-width="1"/>
        <text x="500" y="246" fill="#2f050b" font-size="11" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Meets Course</text>
        <text x="500" y="260" fill="#2f050b" font-size="11" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Requirements?</text>

        <!-- End Oval: Browse Others -->
        <rect x="720" y="224" width="140" height="48" rx="24" fill="rgba(47,5,11,0.03)" stroke="rgba(47,5,11,0.30)" stroke-width="1"/>
        <text x="790" y="248" fill="#2f050b" font-size="12" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Keep Browsing</text>
        <text x="790" y="262" fill="#95505b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no match found</text>

        <!-- Step: Submits Application -->
        <rect x="420" y="336" width="160" height="48" rx="6" fill="#ffffff" stroke="#2f050b" stroke-width="1"/>
        <text x="500" y="364" fill="#2f050b" font-size="12" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Submit Application</text>

        <!-- Step: Company Reviews -->
        <rect x="420" y="416" width="160" height="48" rx="6" fill="#ffffff" stroke="#2f050b" stroke-width="1"/>
        <text x="500" y="444" fill="#2f050b" font-size="12" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Company Reviews CV</text>

        <!-- Diamond 2: Approved? -->
        <polygon points="500,496 600,544 500,592 400,544" fill="#ffffff" stroke="#2f050b" stroke-width="1"/>
        <text x="500" y="542" fill="#2f050b" font-size="11" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Application</text>
        <text x="500" y="556" fill="#2f050b" font-size="11" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Approved?</text>

        <!-- End Oval: Rejected -->
        <rect x="720" y="520" width="140" height="48" rx="24" fill="rgba(47,5,11,0.03)" stroke="rgba(47,5,11,0.30)" stroke-width="1"/>
        <text x="790" y="544" fill="#2f050b" font-size="12" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Rejected</text>
        <text x="790" y="558" fill="#95505b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status updated</text>

        <!-- Focal Oval: Placement Active -->
        <rect x="420" y="632" width="160" height="56" rx="28" fill="rgba(189,17,45,0.08)" stroke="#bd112d" stroke-width="1"/>
        <text x="500" y="660" fill="#2f050b" font-size="12" font-weight="600" font-family="'Poppins', sans-serif" text-anchor="middle">Placement Accepted</text>
        <text x="500" y="674" fill="#95505b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OJT begins</text>


        <!-- Legend -->
        <line x1="40" y1="712" x2="960" y2="712" stroke="rgba(47,5,11,0.12)" stroke-width="0.8"/>
        <text x="40" y="728" fill="#95505b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="744" width="24" height="12" rx="6" fill="rgba(47,5,11,0.03)" stroke="rgba(47,5,11,0.30)" stroke-width="1"/>
        <text x="72" y="754" fill="#95505b" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="220" y="744" width="24" height="12" rx="2" fill="#ffffff" stroke="#2f050b" stroke-width="1"/>
        <text x="252" y="754" fill="#95505b" font-size="8.5" font-family="'Geist', sans-serif">Process Step</text>

        <polygon points="412,750 424,744 436,750 424,756" fill="#ffffff" stroke="#2f050b" stroke-width="1"/>
        <text x="448" y="754" fill="#95505b" font-size="8.5" font-family="'Geist', sans-serif">Logical Decision</text>

        <line x1="604" y1="752" x2="632" y2="752" stroke="#bd112d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="640" y="754" fill="#95505b" font-size="8.5" font-family="'Geist', sans-serif">Happy Path</text>
      </svg>
    </div>
  </div>
</body>
</html>
