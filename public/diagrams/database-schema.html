<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIT Management System · Database Schema</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f4ed;
      --color-ink:     #0b0d0b;
      --color-muted:   #52534e;
      --color-accent:  #c00000;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · Diagram Design</p>
    <h1>SIT Management Database Schema</h1>

    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(11,13,11,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f4ed"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationships -->
        <!-- User - Company (N:1) -->
        <line x1="280" y1="120" x2="380" y2="120" stroke="#52534e" stroke-width="1" />
        
        <!-- User - SITPosting (1:N) -->
        <line x1="480" y1="280" x2="480" y2="380" stroke="#52534e" stroke-width="1" />

        <!-- User - Application (1:N) -->
        <line x1="580" y1="120" x2="720" y2="120" stroke="#52534e" stroke-width="1" />

        <!-- User - LogbookEntry (1:N) -->
        <line x1="420" y1="280" x2="320" y2="400" stroke="#52534e" stroke-width="1" />

        <!-- Company - SITPosting (1:N) -->
        <line x1="160" y1="200" x2="160" y2="420" stroke="#52534e" stroke-width="1" />
        <line x1="160" y1="420" x2="380" y2="420" stroke="#52534e" stroke-width="1" />

        <!-- SITPosting - Application (1:N) -->
        <line x1="580" y1="420" x2="820" y2="420" stroke="#52534e" stroke-width="1" />
        <line x1="820" y1="420" x2="820" y2="200" stroke="#52534e" stroke-width="1" />

        <!-- Entity: Company -->
        <rect x="80" y="80" width="200" height="120" rx="6" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
        <rect x="80" y="80" width="200" height="40" rx="6" fill="rgba(11,13,11,0.04)" stroke="none"/>
        <rect x="80" y="112" width="200" height="8" fill="rgba(11,13,11,0.04)"/>
        <line x1="80" y1="120" x2="280" y2="120" stroke="rgba(11,13,11,0.22)" stroke-width="1"/>
        <text x="96" y="96" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="96" y="112" fill="#0b0d0b" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Company</text>
        <text x="96" y="140" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="260" y="140" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="96" y="160" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">name</text>
        <text x="260" y="160" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="96" y="180" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">isVerified</text>
        <text x="260" y="180" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bool</text>

        <!-- Entity: User (Focal) -->
        <rect x="380" y="40" width="200" height="240" rx="6" fill="rgba(192,0,0,0.04)" stroke="#c00000" stroke-width="1"/>
        <rect x="380" y="40" width="200" height="40" rx="6" fill="rgba(192,0,0,0.10)" stroke="none"/>
        <rect x="380" y="72" width="200" height="8" fill="rgba(192,0,0,0.10)"/>
        <line x1="380" y1="80" x2="580" y2="80" stroke="rgba(192,0,0,0.40)" stroke-width="1"/>
        <text x="396" y="56" fill="#c00000" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="396" y="72" fill="#0b0d0b" font-size="14" font-weight="600" font-family="'Geist', sans-serif">User</text>
        <text x="396" y="100" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="560" y="100" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="396" y="120" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">email</text>
        <text x="560" y="120" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="396" y="140" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">role</text>
        <text x="560" y="140" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="396" y="160" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">course</text>
        <text x="560" y="160" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="396" y="180" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">→ companyId</text>
        <text x="560" y="180" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="396" y="200" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">isApproved</text>
        <text x="560" y="200" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">bool</text>

        <!-- Entity: Application -->
        <rect x="720" y="60" width="200" height="140" rx="6" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
        <rect x="720" y="60" width="200" height="40" rx="6" fill="rgba(11,13,11,0.04)" stroke="none"/>
        <rect x="720" y="92" width="200" height="8" fill="rgba(11,13,11,0.04)"/>
        <line x1="720" y1="100" x2="920" y2="100" stroke="rgba(11,13,11,0.22)" stroke-width="1"/>
        <text x="736" y="76" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">JOIN</text>
        <text x="736" y="92" fill="#0b0d0b" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Application</text>
        <text x="736" y="120" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="900" y="120" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="736" y="140" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">status</text>
        <text x="900" y="140" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="736" y="160" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">→ studentId</text>
        <text x="900" y="160" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="736" y="180" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">→ postingId</text>
        <text x="900" y="180" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

        <!-- Entity: SITPosting -->
        <rect x="380" y="380" width="200" height="160" rx="6" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
        <rect x="380" y="380" width="200" height="40" rx="6" fill="rgba(11,13,11,0.04)" stroke="none"/>
        <rect x="380" y="412" width="200" height="8" fill="rgba(11,13,11,0.04)"/>
        <line x1="380" y1="420" x2="580" y2="420" stroke="rgba(11,13,11,0.22)" stroke-width="1"/>
        <text x="396" y="396" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="396" y="412" fill="#0b0d0b" font-size="14" font-weight="600" font-family="'Geist', sans-serif">SITPosting</text>
        <text x="396" y="440" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="560" y="440" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="396" y="460" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">title</text>
        <text x="560" y="460" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="396" y="480" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">requiredHours</text>
        <text x="560" y="480" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
        <text x="396" y="500" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">→ employerId</text>
        <text x="560" y="500" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="396" y="520" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">→ companyId</text>
        <text x="560" y="520" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

        <!-- Entity: LogbookEntry -->
        <rect x="180" y="400" width="160" height="140" rx="6" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
        <rect x="180" y="400" width="160" height="40" rx="6" fill="rgba(11,13,11,0.04)" stroke="none"/>
        <rect x="180" y="432" width="160" height="8" fill="rgba(11,13,11,0.04)"/>
        <line x1="180" y1="440" x2="340" y2="440" stroke="rgba(11,13,11,0.22)" stroke-width="1"/>
        <text x="196" y="416" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="196" y="432" fill="#0b0d0b" font-size="14" font-weight="600" font-family="'Geist', sans-serif">LogbookEntry</text>
        <text x="196" y="460" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="320" y="460" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="196" y="480" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">date</text>
        <text x="320" y="480" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">date</text>
        <text x="196" y="500" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">hours</text>
        <text x="320" y="500" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">float</text>
        <text x="196" y="520" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace">→ studentId</text>
        <text x="320" y="520" fill="#52534e" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

        <!-- Legend -->
        <line x1="40" y1="600" x2="960" y2="600" stroke="rgba(11,13,11,0.10)" stroke-width="0.8"/>
        <text x="40" y="616" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="632" width="14" height="10" rx="2" fill="rgba(192,0,0,0.04)" stroke="#c00000" stroke-width="1"/>
        <text x="60" y="640" fill="#52534e" font-size="8.5" font-family="'Geist', sans-serif">Aggregate root</text>

        <rect x="180" y="632" width="14" height="10" rx="2" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
        <text x="200" y="640" fill="#52534e" font-size="8.5" font-family="'Geist', sans-serif">Entity</text>

        <text x="372" y="640" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="388" y="640" fill="#52534e" font-size="8.5" font-family="'Geist', sans-serif">Primary key</text>

        <text x="476" y="640" fill="#0b0d0b" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="492" y="640" fill="#52534e" font-size="8.5" font-family="'Geist', sans-serif">Foreign key</text>
      </svg>
  </div>
</body>
</html>
