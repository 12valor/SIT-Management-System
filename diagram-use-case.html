<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIT Management · Use Case Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,400&family=Poppins:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-paper-2: #fef5f6;
      --color-ink:     #2f050b;
      --color-muted:   #95505b;
      --color-soft:    #b07a82;
      --color-accent:  #bd112d;
      --font-sans:     'Poppins', system-ui, sans-serif;
      --font-serif:    'Montserrat', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container {
      background: var(--color-paper-2);
      border: 1px solid rgba(47,5,11,0.12);
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 2rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid rgba(47,5,11,0.12);
      border-radius: 6px;
      padding: 1.25rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .card-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-ink);
    }

    .card-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-list li {
      font-size: 0.85rem;
      color: var(--color-muted);
      line-height: 1.5;
      position: relative;
      padding-left: 1rem;
    }

    .card-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--color-soft);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
        <defs>

        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <line x1="280" y1="208" x2="360" y2="208" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="620" y1="496" x2="560" y2="496" stroke="#95505b" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Coordinator Labels -->

        <rect x="568" y="490" width="44" height="12" rx="2" fill="#ffffff"/>

        <!-- System Boundary -->

        <!-- Actors -->

        <!-- Evaluation Center -->
        <rect x="360" y="272" width="200" height="64" rx="6" fill="#ffffff"/>

      </svg>
    </div>
  </div>
</body>
</html>
